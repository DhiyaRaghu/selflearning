<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>Career Coach AI — Your career practice studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="Career Coach home"><span class="brand-mark">c</span><span>career<span class="brand-light">coach</span></span></a>
      <div class="workspace-label">YOUR WORKSPACE</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span> Overview</button>
        <button class="nav-item" data-view="practice"><span class="nav-icon">◉</span> Practice lab</button>
        <button class="nav-item" data-view="interview"><span class="nav-icon">▣</span> Mock interview</button>
        <button class="nav-item" data-view="coding"><span class="nav-icon">⌘</span> Coding room</button>
        <button class="nav-item" data-view="group"><span class="nav-icon">◎</span> Group discussion <span class="nav-count">2</span></button>
        <button class="nav-item" data-view="resume"><span class="nav-icon">▤</span> Resume studio</button>
        <button class="nav-item" data-view="jobs"><span class="nav-icon">↗</span> Discover jobs <span class="nav-count">4</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="coach-mini"><div class="sparkle">✳</div><div><strong>Your coach is ready</strong><p>Small steps make progress.</p></div><span class="online-dot"></span></div>
        <button class="profile-switch" id="profileButton"><span class="avatar">A</span><span class="profile-meta"><strong id="sideName">Alex Morgan</strong><small>Career starter</small></span><span class="more">•••</span></button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar"><div class="breadcrumb"><span>Workspace</span><span class="slash">/</span><strong id="pageCrumb">Overview</strong></div><div class="top-actions"><span class="today-label" id="todayLabel"></span><button class="icon-button" id="helpButton" aria-label="Help">?</button><button class="top-avatar" id="topAvatar">A</button></div></header>
      <div class="content" id="appContent"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal-wrap hidden" id="modalWrap" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-card"><button class="modal-close" id="modalClose" aria-label="Close">×</button><div id="modalBody"></div></div></div>
  <script src="app.js"></script>
</body>
</html>
